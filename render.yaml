# ============================================
# GESTORE INTERROGAZIONI SCOLASTICHE
# Configurazione Render.com (Blueprint)
# ============================================

services:
  # Database PostgreSQL
  - type: pserv
    name: gestore-interrogazioni-db
    runtime: docker
    plan: free
    env: postgres
    disk:
      name: data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # Backend Node.js
  - type: web
    name: gestore-interrogazioni-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestore-interrogazioni-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # Auth Service Flask
  - type: web
    name: gestore-interrogazioni-auth
    runtime: python
    plan: free
    buildCommand: cd auth-service && pip install -r requirements.txt
    startCommand: cd auth-service && gunicorn app:app
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestore-interrogazioni-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        fromService:
          name: gestore-interrogazioni-api
          type: web
          envVarKey: JWT_SECRET
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        # Genera con: python -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('YourPassword'))"
        value: $2b$10$YourHashedPasswordHere

  # Frontend Static
  - type: static
    name: gestore-interrogazioni
    plan: free
    buildCommand: echo "No build needed"
    staticPublishPath: ./frontend
    envVars:
      - key: API_URL
        fromService:
          name: gestore-interrogazioni-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
