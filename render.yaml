# ============================================
# GESTORE INTERROGAZIONI SCOLASTICHE
# Configurazione Render.com (Blueprint)
# ============================================

services:
  # Database PostgreSQL
  - type: pserv
    name: gestore-interrogazioni-db
    runtime: docker
    plan: free
    env: postgres
    disk:
      name: data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # Backend Node.js (serve anche il frontend!)
  - type: web
    name: gestore-interrogazioni
    runtime: node
    plan: free
    buildCommand: |
      cd backend && npm install
      # Copia frontend nella cartella public del backend
      mkdir -p ../backend/public
      cp -r ../frontend/* ../backend/public/
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestore-interrogazioni-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      # URL del servizio auth (per il proxy)
      - key: AUTH_SERVICE_URL
        fromService:
          name: gestore-interrogazioni-auth
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Credenziali admin (genera hash con: node -e "console.log(require('bcrypt').hashSync('tua-password', 10))")
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false  # Imposta manualmente nel dashboard Render

  # Auth Service Flask
  - type: web
    name: gestore-interrogazioni-auth
    runtime: python
    plan: free
    buildCommand: cd auth-service && pip install -r requirements.txt
    startCommand: cd auth-service && gunicorn app:app
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestore-interrogazioni-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        fromService:
          name: gestore-interrogazioni
          type: web
          envVarKey: JWT_SECRET
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        fromService:
          name: gestore-interrogazioni
          type: web
          envVarKey: ADMIN_PASSWORD_HASH
      # URL del backend per CORS
      - key: BACKEND_URL
        fromService:
          name: gestore-interrogazioni
          type: web
          envVarKey: RENDER_EXTERNAL_URL
